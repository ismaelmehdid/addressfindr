name: Release (Production)

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    environment: production

    steps:
      - name: Verify upstream CI workflow succeeded
        if: github.event.workflow_run.conclusion != 'success'
        run: |
          echo "::error::CI workflow failed (conclusion: ${{ github.event.workflow_run.conclusion }})"
          exit 1

      - name: Trigger Vercel production deploy
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
